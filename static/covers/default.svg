<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="200" height="200" fill="url(#bg)" rx="20"/>
  
  <!-- 人物图标 -->
  <circle cx="100" cy="80" r="30" fill="white" opacity="0.9"/>
  <path d="M100 120 Q70 120 50 140 Q50 160 70 160 L130 160 Q150 160 150 140 Q130 120 100 120 Z" 
        fill="white" opacity="0.9"/>
  
  <!-- 装饰元素 -->
  <circle cx="60" cy="40" r="3" fill="white" opacity="0.6"/>
  <circle cx="140" cy="160" r="2" fill="white" opacity="0.6"/>
  <circle cx="160" cy="60" r="2" fill="white" opacity="0.4"/>
</svg>