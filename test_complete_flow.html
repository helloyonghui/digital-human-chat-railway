<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>完整通话流程测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            border-left: 4px solid #4CAF50;
        }
        .test-section.error {
            border-left-color: #f44336;
        }
        .test-section.warning {
            border-left-color: #ff9800;
        }
        button {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
            transition: all 0.3s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        .status.success { background: rgba(76, 175, 80, 0.3); }
        .status.error { background: rgba(244, 67, 54, 0.3); }
        .status.info { background: rgba(33, 150, 243, 0.3); }
        .status.warning { background: rgba(255, 152, 0, 0.3); }
        #videoContainer {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        video {
            width: 300px;
            height: 200px;
            border-radius: 10px;
            background: #000;
        }
        .log {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            margin: 20px 0;
        }
        .progress {
            width: 100%;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 数字人通话系统 - 完整流程测试</h1>
        
        <div class="test-section">
            <h3>📋 测试进度</h3>
            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div id="currentStep">准备开始测试...</div>
        </div>

        <div class="test-section">
            <h3>🔧 系统检查</h3>
            <button onclick="runSystemCheck()">开始系统检查</button>
            <div id="systemStatus"></div>
        </div>

        <div class="test-section">
            <h3>🎤 麦克风权限</h3>
            <button onclick="requestMicPermission()">请求麦克风权限</button>
            <div id="micStatus"></div>
        </div>

        <div class="test-section">
            <h3>🔗 LiveKit连接</h3>
            <button onclick="testLiveKitConnection()">测试LiveKit连接</button>
            <div id="liveKitStatus"></div>
        </div>

        <div class="test-section">
            <h3>🎥 视频流</h3>
            <button onclick="startVideoCall()">开始视频通话</button>
            <button onclick="stopVideoCall()" disabled id="stopBtn">停止通话</button>
            <div id="videoStatus"></div>
            <div id="videoContainer"></div>
        </div>

        <div class="test-section">
            <h3>🎙️ 音频录制</h3>
            <button onclick="testAudioRecording()">测试音频录制</button>
            <div id="audioStatus"></div>
        </div>

        <div class="test-section">
            <h3>🤖 数字人模板</h3>
            <button onclick="testTemplateAPI()">测试模板API</button>
            <div id="templateStatus"></div>
        </div>

        <div class="test-section">
            <h3>🔄 完整流程</h3>
            <button onclick="runCompleteTest()">运行完整测试</button>
            <div id="completeTestStatus"></div>
        </div>

        <div class="test-section">
            <h3>📝 测试日志</h3>
            <div class="log" id="testLog"></div>
            <button onclick="clearLog()">清空日志</button>
        </div>
    </div>

    <script src="/lib/livekit-client.umd.min.js"></script>
    <script>
        let room = null;
        let localVideoTrack = null;
        let testProgress = 0;
        const totalSteps = 7;

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logElement = document.getElementById('testLog');
            const logEntry = document.createElement('div');
            logEntry.className = `status ${type}`;
            logEntry.innerHTML = `[${timestamp}] ${message}`;
            logElement.appendChild(logEntry);
            logElement.scrollTop = logElement.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        function updateProgress(step, message) {
            testProgress = step;
            const percentage = (step / totalSteps) * 100;
            document.getElementById('progressBar').style.width = `${percentage}%`;
            document.getElementById('currentStep').textContent = message;
            log(`步骤 ${step}/${totalSteps}: ${message}`);
        }

        function setStatus(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="status ${type}">${message}</div>`;
        }

        async function runSystemCheck() {
            log('开始系统检查...', 'info');
            updateProgress(1, '检查系统环境');
            
            try {
                // 检查LiveKit库
                if (typeof LiveKit === 'undefined') {
                    throw new Error('LiveKit库未加载');
                }
                log('✅ LiveKit库已加载', 'success');

                // 检查浏览器支持
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error('浏览器不支持媒体设备访问');
                }
                log('✅ 浏览器支持媒体设备', 'success');

                // 检查WebRTC支持
                if (!window.RTCPeerConnection) {
                    throw new Error('浏览器不支持WebRTC');
                }
                log('✅ 浏览器支持WebRTC', 'success');

                setStatus('systemStatus', '系统检查通过', 'success');
            } catch (error) {
                log(`❌ 系统检查失败: ${error.message}`, 'error');
                setStatus('systemStatus', `系统检查失败: ${error.message}`, 'error');
            }
        }

        async function requestMicPermission() {
            log('请求麦克风权限...', 'info');
            updateProgress(2, '获取麦克风权限');
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                log('✅ 麦克风权限获取成功', 'success');
                setStatus('micStatus', '麦克风权限已获取', 'success');
                
                // 停止流以释放资源
                stream.getTracks().forEach(track => track.stop());
            } catch (error) {
                log(`❌ 麦克风权限获取失败: ${error.message}`, 'error');
                setStatus('micStatus', `麦克风权限获取失败: ${error.message}`, 'error');
            }
        }

        async function testLiveKitConnection() {
            log('测试LiveKit连接...', 'info');
            updateProgress(3, '连接LiveKit服务器');
            
            try {
                // 获取连接信息
                const response = await fetch('/lk/join', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        roomName: 'test-room-' + Date.now(),
                        participantName: 'test-user-' + Math.random().toString(36).substr(2, 9)
                    })
                });

                if (!response.ok) {
                    throw new Error(`API请求失败: ${response.status}`);
                }

                const data = await response.json();
                log(`✅ LiveKit连接信息获取成功: ${data.wsUrl}`, 'success');

                // 测试实际连接
                const testRoom = new LiveKit.Room();
                
                return new Promise((resolve, reject) => {
                    const timeout = setTimeout(() => {
                        testRoom.disconnect();
                        reject(new Error('连接超时'));
                    }, 10000);

                    testRoom.on(LiveKit.RoomEvent.Connected, () => {
                        clearTimeout(timeout);
                        log('✅ LiveKit房间连接成功', 'success');
                        setStatus('liveKitStatus', 'LiveKit连接正常', 'success');
                        testRoom.disconnect();
                        resolve();
                    });

                    testRoom.on(LiveKit.RoomEvent.ConnectionFailed, (error) => {
                        clearTimeout(timeout);
                        log(`❌ LiveKit连接失败: ${error.message}`, 'error');
                        setStatus('liveKitStatus', `LiveKit连接失败: ${error.message}`, 'error');
                        reject(error);
                    });

                    testRoom.connect(data.wsUrl, data.token);
                });

            } catch (error) {
                log(`❌ LiveKit连接测试失败: ${error.message}`, 'error');
                setStatus('liveKitStatus', `LiveKit连接失败: ${error.message}`, 'error');
                throw error;
            }
        }

        async function startVideoCall() {
            log('开始视频通话...', 'info');
            updateProgress(4, '建立视频通话');
            
            try {
                // 获取连接信息
                const response = await fetch('/lk/join', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        roomName: 'video-test-' + Date.now(),
                        participantName: 'video-user-' + Math.random().toString(36).substr(2, 9)
                    })
                });

                const data = await response.json();
                
                // 创建房间
                room = new LiveKit.Room({
                    adaptiveStream: true,
                    dynacast: true,
                });

                // 设置事件监听
                room.on(LiveKit.RoomEvent.Connected, () => {
                    log('✅ 视频通话房间连接成功', 'success');
                    setStatus('videoStatus', '视频通话已建立', 'success');
                    document.getElementById('stopBtn').disabled = false;
                });

                room.on(LiveKit.RoomEvent.TrackSubscribed, (track, publication, participant) => {
                    log(`🎥 订阅到视频轨道: ${track.kind} from ${participant.identity}`, 'success');
                    
                    if (track.kind === 'video') {
                        const videoElement = document.createElement('video');
                        videoElement.autoplay = true;
                        videoElement.playsInline = true;
                        videoElement.controls = true;
                        track.attach(videoElement);
                        document.getElementById('videoContainer').appendChild(videoElement);
                    }
                });

                room.on(LiveKit.RoomEvent.Disconnected, () => {
                    log('视频通话已断开', 'info');
                    setStatus('videoStatus', '视频通话已断开', 'info');
                    document.getElementById('stopBtn').disabled = true;
                    document.getElementById('videoContainer').innerHTML = '';
                });

                // 连接房间
                await room.connect(data.wsUrl, data.token);
                
                // 发布本地视频（如果有摄像头）
                try {
                    const localTracks = await LiveKit.createLocalTracks({
                        audio: true,
                        video: true
                    });
                    
                    for (const track of localTracks) {
                        await room.localParticipant.publishTrack(track);
                        if (track.kind === 'video') {
                            localVideoTrack = track;
                            const videoElement = document.createElement('video');
                            videoElement.autoplay = true;
                            videoElement.playsInline = true;
                            videoElement.muted = true; // 本地视频静音
                            track.attach(videoElement);
                            document.getElementById('videoContainer').appendChild(videoElement);
                        }
                    }
                    log('✅ 本地音视频流发布成功', 'success');
                } catch (error) {
                    log(`⚠️ 本地音视频获取失败: ${error.message}`, 'warning');
                }

            } catch (error) {
                log(`❌ 视频通话启动失败: ${error.message}`, 'error');
                setStatus('videoStatus', `视频通话失败: ${error.message}`, 'error');
            }
        }

        function stopVideoCall() {
            if (room) {
                room.disconnect();
                room = null;
                localVideoTrack = null;
                log('视频通话已停止', 'info');
            }
        }

        async function testAudioRecording() {
            log('测试音频录制...', 'info');
            updateProgress(5, '测试音频录制功能');
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                log('✅ 音频流获取成功', 'success');
                
                // 创建音频录制器
                const mediaRecorder = new MediaRecorder(stream);
                const audioChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };
                
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    log(`✅ 音频录制完成，大小: ${audioBlob.size} bytes`, 'success');
                    setStatus('audioStatus', '音频录制功能正常', 'success');
                    
                    // 停止流
                    stream.getTracks().forEach(track => track.stop());
                };
                
                // 录制2秒
                mediaRecorder.start();
                setTimeout(() => {
                    mediaRecorder.stop();
                }, 2000);
                
            } catch (error) {
                log(`❌ 音频录制测试失败: ${error.message}`, 'error');
                setStatus('audioStatus', `音频录制失败: ${error.message}`, 'error');
            }
        }

        async function testTemplateAPI() {
            log('测试数字人模板API...', 'info');
            updateProgress(6, '测试数字人模板');
            
            try {
                const response = await fetch('/templates');
                if (!response.ok) {
                    throw new Error(`模板API请求失败: ${response.status}`);
                }
                
                const templates = await response.json();
                log(`✅ 获取到 ${templates.length} 个数字人模板`, 'success');
                setStatus('templateStatus', `数字人模板API正常 (${templates.length}个模板)`, 'success');
                
            } catch (error) {
                log(`❌ 数字人模板API测试失败: ${error.message}`, 'error');
                setStatus('templateStatus', `模板API失败: ${error.message}`, 'error');
            }
        }

        async function runCompleteTest() {
            log('开始完整流程测试...', 'info');
            updateProgress(7, '运行完整测试流程');
            
            try {
                await runSystemCheck();
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                await requestMicPermission();
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                await testLiveKitConnection();
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                await testAudioRecording();
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                await testTemplateAPI();
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                log('🎉 完整流程测试通过！', 'success');
                setStatus('completeTestStatus', '完整流程测试通过！', 'success');
                updateProgress(totalSteps, '所有测试完成');
                
            } catch (error) {
                log(`❌ 完整流程测试失败: ${error.message}`, 'error');
                setStatus('completeTestStatus', `完整流程测试失败: ${error.message}`, 'error');
            }
        }

        function clearLog() {
            document.getElementById('testLog').innerHTML = '';
        }

        // 页面加载完成后的初始化
        window.addEventListener('load', () => {
            log('🚀 测试页面加载完成', 'info');
            log('请按顺序执行各项测试，或直接运行完整测试', 'info');
        });

        // 页面卸载时清理资源
        window.addEventListener('beforeunload', () => {
            if (room) {
                room.disconnect();
            }
        });
    </script>
</body>
</html>
